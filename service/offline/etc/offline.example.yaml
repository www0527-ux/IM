Name: offline-message-store
Mode: dev
Host: 0.0.0.0
Port: 8105

# Change to outbox only after the new MessageWriteService transaction is ready.
MessagePipeline:
  Mode: legacy

DataSource: root:YOUR_MYSQL_PASSWORD@tcp(127.0.0.1:3306)/infiniteChat?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

Redis:
  Host: 127.0.0.1:6379
  Pass: ""
  Type: node

Auth:
  Issuer: infinitechat-user-api
  AccessSecret: CHANGE_ME_TO_THE_SAME_SECRET_AS_USER_API
  AccessExpire: 900
  RefreshExpire: 604800

Sync:
  DefaultLimit: 100
  MaxLimit: 200
  MaxConversations: 50

Kafka:
  Brokers:
    - 127.0.0.1:9092
  SequencedTopic: chat-message-sequenced-topic
  StoreGroup: message-store-consumer-group
