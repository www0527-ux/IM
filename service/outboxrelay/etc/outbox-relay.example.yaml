Name: outbox-relay
Mode: dev

DataSource: root:YOUR_MYSQL_PASSWORD@tcp(127.0.0.1:3306)/infiniteChat?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

Kafka:
  Brokers:
    - 127.0.0.1:9092

Relay:
  WorkerID: local-relay-1
  BatchSize: 100
  PollIntervalMillis: 200
  LeaseSeconds: 30
  MaxRetryBackoffSecs: 60

Log:
  Mode: console
  Level: info
  Stat: false
