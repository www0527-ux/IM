Name: realtime
Snowflake:
  NodeID: 2
Mode: dev

ListenOn: 0.0.0.0:9101

# Push recipients only; send and red packet authorization still use live RPC.
GroupMemberCache:
  Disabled: false
  TTLSeconds: 5
  Capacity: 1024
  Channel: im:group-members:invalidate:v1

MessagePipeline:
  ContentCacheTTLSeconds: 604800
  IdempotencyCacheTTLSeconds: 604800
  Batching:
    Workers: 8
    QueueCapacity: 256
    BatchSize: 32
    FlushMillis: 2
    TimeoutMillis: 10000
    SeparateConversations: false
  Publishing:
    BatchSize: 32
    FlushMillis: 1
    QueueCapacity: 512
  ConsumerCommits:
    Disabled: false
    BatchSize: 32
    IntervalMillis: 10

DataSource: root:YOUR_MYSQL_PASSWORD@tcp(127.0.0.1:3306)/infiniteChat?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
MySQLPool:
  MaxOpenConns: 24
  MaxIdleConns: 8

Redis:
  Host: 127.0.0.1:6379
  Pass: ""
  Type: node

Auth:
  Issuer: infinitechat-user-api
  AccessSecret: REPLACE_WITH_THE_SAME_SECRET_AS_USER_API
  AccessExpire: 900
  RefreshExpire: 604800

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

Kafka:
  Brokers:
    - 127.0.0.1:9092
  CreateRequestedTopic: message-create-requested-topic
  PersistedTopic: message-persisted-topic
  DLQTopic: message-consumer-dlq-topic
  MessageWriterGroup: message-writer-consumer-group
  PushGroup: message-push-consumer-group
  MessageCacheGroup: message-cache-consumer-group
